version: '3.8'
services:
  watcher:
    build: .
    volumes:
      - ./watcher.db:/app/watcher.db
      - ./logs:/app/logs
      - ./backups:/app/backups
    environment:
      - FLASK_ENV=production
    ports:
      - "1212:1212"
  archivebox:
    image: archivebox/archivebox:latest
    # Note: configure volumes for persistent archive storage
    volumes:
      - ./archivebox_data:/data
    ports:
      - "8000:8000"
