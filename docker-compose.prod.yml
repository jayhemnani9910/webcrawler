version: '3.8'

services:
  watcher:
    build: .
    image: webcrawler/watcher:latest
    env_file:
      - .env.prod
    volumes:
      - watcher_db:/var/lib/website-watcher
      - ./logs:/app/logs
      - ./archivebox_data:/app/archivebox_data
    ports:
      - "1212:1212"
    depends_on:
      - ipfs
      - archivebox
    restart: unless-stopped

  archivebox:
    image: origin/archivebox:latest
    environment:
      - PUID=1000
      - PGID=1000
    volumes:
      - archivebox_data:/data
    ports:
      - "8000:8000"
    restart: unless-stopped

  ipfs:
    # Matches docker-compose.integration.yml. go-ipfs was renamed to kubo and
    # the old image is no longer the maintained one, so the stack integration
    # tests validated was not the stack production ran.
    image: ipfs/kubo:release
    volumes:
      - ipfs_data:/data/ipfs
    ports:
      - "4001:4001"
      - "5001:5001"
    restart: unless-stopped

  libp2p_relay:
    build: ./services/libp2p-relay
    image: webcrawler/libp2p-relay:latest
    ports:
      - "15000:15000"
    restart: unless-stopped

  otsd:
    build: ./services/otsd-sim
    image: webcrawler/otsd-sim:latest
    volumes:
      - otsd_data:/data/ots
    environment:
      - PORT=16000
    ports:
      - "16000:16000"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    environment:
      # Grafana defaults to admin/admin when this is unset. Required, with no
      # fallback, so a missing value fails the stack rather than shipping the
      # default password.
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:?set GF_SECURITY_ADMIN_PASSWORD in .env.prod}
    ports:
      # Bound to loopback. This was published on every interface with default
      # credentials, which put the admin console on the open internet.
      - "127.0.0.1:3000:3000"
    restart: unless-stopped

volumes:
  watcher_db:
  archivebox_data:
  ipfs_data:
  otsd_data:

